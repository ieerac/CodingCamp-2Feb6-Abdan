<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 My To-Do List</h1>
            <p>Kelola tugas harian kamu dengan mudah</p>
            <div id="currentTime" class="current-time">00:00:00</div>
        </header>

        <main>
            <!-- Form Input -->
            <section class="input-section">
                <form id="todoForm">
                    <div class="form-group">
                        <label for="todoInput">Task:</label>
                        <input 
                            type="text" 
                            id="todoInput" 
                            placeholder="Masukkan tugas baru..."
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="todoDate">Tanggal:</label>
                        <input 
                            type="date" 
                            id="todoDate" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="todoTime">Jam:</label>
                        <input 
                            type="time" 
                            id="todoTime" 
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-add">➕ Tambah Task</button>
                </form>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <h3>Filter</h3>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Semua</button>
                    <button class="filter-btn" data-filter="pending">Belum Selesai</button>
                    <button class="filter-btn" data-filter="completed">Selesai</button>
                </div>
                <input 
                    type="date" 
                    id="filterDate" 
                    class="filter-date" 
                    placeholder="Filter berdasarkan tanggal"
                >
            </section>

            <!-- To-Do List Display -->
            <section class="todo-list-section">
                <h3>Daftar Task (<span id="taskCount">0</span>)</h3>
                <div id="todoList" class="todo-list">
                    <p class="empty-message">Belum ada task. Mulai tambah task sekarang! 🎯</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 My To-Do List | CodingCamp Mini Project</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
