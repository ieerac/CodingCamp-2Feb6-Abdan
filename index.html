<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 To-Do List</h1>
            <p class="subtitle">Organize your tasks efficiently</p>
        </header>
    
    <form id="todoForm" class="form-section">
            <div class="form-group">
                <label for="todoText">Task Description</label>
                <input 
                    type="text" 
                    id="todoText" 
                    placeholder="Enter your task..."
                    required
                    autocomplete="off"
                >
                <span class="error-message" id="textError"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="todoDue">Due Date</label>
                    <input 
                        type="date" 
                        id="todoDue" 
                        required
                    >
                    <span class="error-message" id="dateError"></span>
                </div>

                <div class="form-group">
                    <label for="todoTime">Time</label>
                    <input 
                        type="time" 
                        id="todoTime" 
                        required
                    >
                    <span class="error-message" id="timeError"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">➕ Add Task</button>
        </form>

        <div class="filter-section">
            <div class="filter-group">
                <label for="filterStatus">Filter by Status:</label>
                <select id="filterStatus" class="filter-select">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sortBy">Sort by:</label>
                <select id="sortBy" class="filter-select">
                    <option value="date-asc">Date (Oldest First)</option>
                    <option value="date-desc">Date (Newest First)</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>

            <button id="clearAllBtn" class="btn btn-danger btn-small">🗑️ Clear Completed</button>
        </div>


        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Pending:</span>
                <span class="stat-value pending" id="pendingCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value completed" id="completedCount">0</span>
            </div>
        </div>

        <div class="list-container">
            <ul id="todoList" class="todo-list"></ul>
            <div id="emptyMessage" class="empty-message">
                <p>✨ No tasks yet. Add one to get started!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
